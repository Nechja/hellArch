<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/utilities.css">
</head>
<body class="min-h-screen flex-col-center p-8">
    <div class="text-center max-w-md">
        <div class="text-text-muted font-bold" style="font-size: 6rem; line-height: 1;">404</div>
        <h1 class="text-heading mb-4">Page Not Found</h1>
        <p class="text-caption mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <div class="flex-center gap-4">
            <a href="/" class="btn-primary">Go Home</a>
            <a href="javascript:history.back()" class="btn-secondary">Go Back</a>
        </div>
    </div>
</body>
</html>
