[package]
name = "events-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
tokio-stream = "0.1"
lapin = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "1"
hellarch-cloud-events = { path = "../../../libs/cloud_events/rust" }
