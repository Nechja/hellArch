[project]
name = "hellarch-testing"
version = "0.1.0"
description = "Integration and golden path testing service for hellArch"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "cloudevents>=1.11",
    "structlog>=24.0",
    "schedule>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: quick sanity checks",
    "integration: service-to-service tests",
    "golden: critical path tests",
    "contract: API schema validation tests",
    "errors: error path and edge case tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
