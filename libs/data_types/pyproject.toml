[project]
name = "hellarch-codegen"
version = "0.1.0"
description = "Generate typed data models from JSON Schema for all HellArch languages"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codegen = "codegen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codegen"]
