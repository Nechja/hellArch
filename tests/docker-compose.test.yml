services:
  auth-db:
    image: hellarch-auth-db
    build:
      context: ..
      dockerfile: infra/dbs/auth-db/Dockerfile
    container_name: hellarch-test-auth-db
    environment:
      POSTGRES_USER: hellarch
      POSTGRES_PASSWORD: hellarch
      POSTGRES_DB: auth_db
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellarch -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hellarch-test

  user-db:
    image: hellarch-user-db
    build:
      context: ..
      dockerfile: infra/dbs/user-db/Dockerfile
    container_name: hellarch-test-user-db
    environment:
      POSTGRES_USER: hellarch
      POSTGRES_PASSWORD: hellarch
      POSTGRES_DB: user_db
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellarch -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hellarch-test

  redis:
    image: redis:7-alpine
    container_name: hellarch-test-redis
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hellarch-test

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hellarch-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hellarch
      RABBITMQ_DEFAULT_PASS: hellarch
    ports:
      - "5682:5672"
      - "15682:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - hellarch-test

networks:
  hellarch-test:
    name: hellarch-test
