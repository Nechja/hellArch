[project]
name = "hellarch-tests"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist",
    "httpx>=0.27",
    "respx>=0.22",
    "pydantic>=2.0",
    "faker",
    "psycopg[binary]>=3.0",
    "redis>=5.0",
    "aio-pika>=9.0",
    "python-jose[cryptography]",
    "hellarch-types",
]

[tool.uv.sources]
hellarch-types = { path = "../libs/data_types/python" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["api", "integration", "e2e"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
