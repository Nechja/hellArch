[project]
name = "hellarch-tests"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.0",
    "httpx>=0.27",
    "respx>=0.22",
    "pydantic>=2.0",
    "faker",
    "psycopg[binary]>=3.0",
    "redis>=5.0",
    "aio-pika>=9.0",
    "python-jose[cryptography]",
    "hellarch-types",
]

[tool.uv]
package = false

[tool.uv.sources]
hellarch-types = { path = "../libs/data_types/python" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["api", "integration", "e2e", "contract"]
markers = [
    "smoke: Quick sanity checks that should always pass",
    "slow: Tests that take longer to run",
    "integration: Tests requiring external services",
    "e2e: End-to-end tests covering full user flows",
    "contract: API contract and schema validation tests",
    "auth: Authentication related tests",
    "user: User service tests",
    "admin: Admin functionality tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
timeout = 30

[tool.coverage.run]
source = ["api", "integration", "e2e", "contract"]
branch = true
parallel = true
omit = ["*/__pycache__/*", "*/fixtures/*", "conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "coverage_html"
