services:
  gateway:
    build:
      context: ../../src/gateway
      dockerfile: Dockerfile
    container_name: hellarch-gateway
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      - LOG_LEVEL=debug
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../../src/gateway:/app
      - gateway-nuget:/root/.nuget
    networks:
      - hellarch
    restart: unless-stopped

  auth:
    build:
      context: ../../src/services/auth
      dockerfile: Dockerfile
    container_name: hellarch-auth
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5001:5001"
    env_file:
      - ../../.env
    environment:
      - HTTP_ADDRESS=:5001
      - GRPC_ADDRESS=:50051
      - AUTH_DATABASE_URL=postgres://hellarch:hellarch@auth-db:5432/auth_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - JWT_PRIVATE_KEY_PATH=/keys/dev-private.pem
      - JWT_PUBLIC_KEY_PATH=/keys/dev-public.pem
      # Discord vars loaded from env_file
      - HELLARCH_ENV=development
      - LOG_LEVEL=debug
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../../src/services/auth:/app
      - ../../infra/keys:/keys:ro
      - auth-go-cache:/go/pkg/mod
    networks:
      - hellarch
    restart: unless-stopped

  user:
    build:
      context: ../../src/services/user
      dockerfile: Dockerfile
    container_name: hellarch-user
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_URLS=http://+:5002
      - ASPNETCORE_ENVIRONMENT=Development
      - USER_DATABASE_URL=Host=user-db;Port=5432;Database=user_db;Username=hellarch;Password=hellarch
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - LOG_LEVEL=debug
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../../src/services/user:/app
      - ../../libs:/libs
      - user-nuget:/root/.nuget
    networks:
      - hellarch
    restart: unless-stopped

  events-worker:
    build:
      context: ../../src/workers/events
      dockerfile: Dockerfile
    container_name: hellarch-events-worker
    environment:
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - RUST_LOG=info
    networks:
      - hellarch
    restart: unless-stopped

  admin:
    build:
      context: ../../src/clients/Admin
      dockerfile: Dockerfile
    container_name: hellarch-admin
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - GATEWAY_URL=http://hellarch-gateway:5000
      - REDIS_URL=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../../src/clients/Admin:/app
      - admin-nuget:/root/.nuget
    networks:
      - hellarch
    restart: unless-stopped

volumes:
  gateway-nuget:
  auth-go-cache:
  user-nuget:
  admin-nuget:

networks:
  hellarch:
    external: true
