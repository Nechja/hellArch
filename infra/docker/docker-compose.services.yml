services:
  gateway:
    build:
      context: ../../src/gateway
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-gateway
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      - LOG_LEVEL=debug
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../../src/gateway:/app
      - gateway-nuget:/root/.nuget
    networks:
      - hellarch
    restart: unless-stopped

  auth:
    build:
      context: ../../src/services/auth
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-auth
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5001:5001"
    env_file:
      - ../../.env
      - ../../.env.secrets
    environment:
      - HTTP_ADDRESS=:5001
      - GRPC_ADDRESS=:50051
      - AUTH_DATABASE_URL=postgres://hellarch:hellarch@auth-db:5432/auth_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - JWT_PRIVATE_KEY_PATH=/keys/dev-private.pem
      - JWT_PUBLIC_KEY_PATH=/keys/dev-public.pem
      # Discord vars loaded from env_file
      - HELLARCH_ENV=development
      - LOG_LEVEL=debug
      - OTEL_SERVICE_NAME=auth
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../../src/services/auth:/app
      - ../../libs:/libs
      - ../../infra/keys:/keys:ro
      - auth-go-cache:/go/pkg/mod
    networks:
      - hellarch
    restart: unless-stopped

  user:
    build:
      context: ../../src/services/user
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-user
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_URLS=http://+:5002
      - ASPNETCORE_ENVIRONMENT=Development
      - USER_DATABASE_URL=Host=user-db;Port=5432;Database=user_db;Username=hellarch;Password=hellarch
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - LOG_LEVEL=debug
      - OTEL_SERVICE_NAME=user
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../../src/services/user:/app
      - ../../libs:/libs
      - user-nuget:/root/.nuget
    networks:
      - hellarch
    restart: unless-stopped

  admin:
    build:
      context: ../../src/clients/Admin
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-admin
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5003:5003"
    env_file:
      - ../../.env
      - ../../.env.secrets
    environment:
      - PORT=5003
      - GATEWAY_URL=http://hellarch-gateway:5000
      - REDIS_URL=redis:6379
      - RABBITMQ_MANAGEMENT_URL=http://rabbitmq:15672
      - RABBITMQ_USER=${RABBITMQ_USER:-hellarch}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-hellarch}
      - HEALTH_SERVICE_URL=http://health:5004
      - OTEL_SERVICE_NAME=admin
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../../src/clients/Admin:/app
      - admin-nuget:/root/.nuget
    networks:
      - hellarch
    restart: unless-stopped

  health:
    build:
      context: ../../src/services/health
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-health
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - POLL_INTERVAL_MS=10000
      - EVENTS_SERVICE_URL=http://events:5005
      - RABBITMQ_MANAGEMENT_URL=http://hellarch:hellarch@rabbitmq:15672
      - OTEL_SERVICE_NAME=health
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../../src/services/health:/app
    networks:
      - hellarch
    restart: unless-stopped

  events:
    build:
      context: ../../src/services/events
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-events
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5005:5005"
    environment:
      - HTTP_ADDRESS=:5005
      - DATABASE_URL=postgres://hellarch:hellarch@events-db:5432/events_db
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - OTEL_SERVICE_NAME=events
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../../src/services/events:/app
      - ../../libs:/libs
      - events-go-cache:/go/pkg/mod
    networks:
      - hellarch
    restart: unless-stopped

  audit-worker:
    build:
      context: ../../src/workers/audit
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-audit-worker
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - EVENTS_API_URL=http://events:5005
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - OTEL_SERVICE_NAME=audit-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4318
    volumes:
      - ../../src/workers/audit:/app
      - ../../libs:/libs
      - audit-go-cache:/go/pkg/mod
    networks:
      - hellarch
    restart: unless-stopped

  webhooks-worker:
    build:
      context: ../../src/workers/webhooks
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-webhooks-worker
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - EVENTS_API_URL=http://events:5005
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - OTEL_SERVICE_NAME=webhooks-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4318
    volumes:
      - ../../src/workers/webhooks:/app
      - ../../libs:/libs
      - webhooks-go-cache:/go/pkg/mod
    networks:
      - hellarch
    restart: unless-stopped

  realtime-worker:
    build:
      context: ../../src/workers/realtime
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-realtime-worker
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5020:5020"
    env_file:
      - ../../.env
      - ../../.env.secrets
    environment:
      - ASPNETCORE_URLS=http://+:5020
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - AUTH_SERVICE_URL=http://hellarch-auth:5001
      - JWT_PUBLIC_KEY_PATH=/keys/dev-public.pem
      - CORS_ORIGINS=http://localhost:5000,http://localhost:5010,http://hellarch-gateway:5000,http://hellarch-admin:5003
      - OTEL_SERVICE_NAME=realtime-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../../src/workers/realtime:/app
      - ../../infra/keys:/keys:ro
      - realtime-nuget:/root/.nuget
    networks:
      - hellarch
    restart: unless-stopped

  infra-worker:
    build:
      context: ../../src/workers/infra
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-infra-worker
    # No user: directive - needs root for Docker socket access
    environment:
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - ORCHESTRATOR_BACKEND=docker
      - RESTART_COOLDOWN_SECONDS=60
      - MAX_RESTARTS=3
      - RESTART_WINDOW_SECONDS=300
      - OTEL_SERVICE_NAME=infra-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../../src/workers/infra:/app
      - ../../libs:/libs
      - infra-go-cache:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hellarch
    restart: unless-stopped

  dlq-worker:
    build:
      context: ../../src/workers/dlq
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-dlq-worker
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5025:5025"
    environment:
      - ASPNETCORE_URLS=http://+:5025
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - OTEL_SERVICE_NAME=dlq-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../../src/workers/dlq:/app
      - dlq-nuget:/root/.nuget
    networks:
      - hellarch
    restart: unless-stopped

volumes:
  gateway-nuget:
  auth-go-cache:
  user-nuget:
  admin-nuget:
  events-go-cache:
  audit-go-cache:
  webhooks-go-cache:
  realtime-nuget:
  infra-go-cache:
  dlq-nuget:

networks:
  hellarch:
    external: true
