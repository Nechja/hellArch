services:
  gateway:
    build:
      context: ../../src/gateway
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-gateway
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      - LOG_LEVEL=debug
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../../src/gateway:/app
      - gateway-nuget:/root/.nuget
    networks:
      - hellarch
    restart: unless-stopped

  auth:
    build:
      context: ../..
      dockerfile: src/services/auth/Dockerfile
      target: dev
    container_name: hellarch-auth
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5001:5001"
    env_file:
      - ../../.env
      - ../../.env.secrets
    environment:
      - HTTP_ADDRESS=:5001
      - GRPC_ADDRESS=:50051
      - AUTH_DATABASE_URL=postgres://hellarch:hellarch@auth-db:5432/auth_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - JWT_PRIVATE_KEY_PATH=/keys/dev-private.pem
      - JWT_PUBLIC_KEY_PATH=/keys/dev-public.pem
      # OAuth vars loaded from env_file
      - HELLARCH_IDENTITY_URL=http://hellarch-identity:5010
      - HELLARCH_ENV=development
      - LOG_LEVEL=debug
      - OTEL_SERVICE_NAME=auth
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../..:/repo
      - ../../infra/keys:/keys:ro
      - auth-go-cache:/go/pkg/mod
    working_dir: /repo/src/services/auth
    networks:
      - hellarch
    restart: unless-stopped

  user:
    build:
      context: ../..
      dockerfile: src/services/user/Dockerfile
      target: dev
    container_name: hellarch-user
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_URLS=http://+:5002
      - ASPNETCORE_ENVIRONMENT=Development
      - USER_DATABASE_URL=Host=user-db;Port=5432;Database=user_db;Username=hellarch;Password=hellarch
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - LOG_LEVEL=debug
      - OTEL_SERVICE_NAME=user
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../..:/repo
      - user-nuget:/root/.nuget
    working_dir: /repo/src/services/user/User
    networks:
      - hellarch
    restart: unless-stopped

  identity:
    build:
      context: ../..
      dockerfile: src/services/identity/Dockerfile
      target: dev
    container_name: hellarch-identity
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5010:5010"
    env_file:
      - ../../.env
    environment:
      - ASPNETCORE_URLS=http://+:5010
      - ASPNETCORE_ENVIRONMENT=Development
      - IDENTITY_DATABASE_URL=Host=identity-db;Port=5432;Database=identity_db;Username=hellarch;Password=hellarch
      - IDENTITY_CLIENT_URL=http://localhost:5000/identity
      # Seed client for auth service - set these in .env
      - IDENTITY_SEED_CLIENT_ID=${HELLARCH_CLIENT_ID:-}
      - IDENTITY_SEED_CLIENT_SECRET=${HELLARCH_CLIENT_SECRET:-}
      - IDENTITY_SEED_REDIRECT_URIS=http://localhost:5000/api/auth/hellarch/callback,http://hellarch-gateway:5000/api/auth/hellarch/callback
      - LOG_LEVEL=debug
      - OTEL_SERVICE_NAME=identity
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../..:/repo
      - identity-nuget:/root/.nuget
    working_dir: /repo/src/services/identity/Identity
    networks:
      - hellarch
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: src/clients/Admin/Dockerfile
      target: dev
    container_name: hellarch-admin
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5003:5003"
    env_file:
      - ../../.env
      - ../../.env.secrets
    environment:
      - PORT=5003
      - GATEWAY_URL=http://hellarch-gateway:5000
      - REDIS_URL=redis:6379
      - RABBITMQ_MANAGEMENT_URL=http://rabbitmq:15672
      - RABBITMQ_USER=${RABBITMQ_USER:-hellarch}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-hellarch}
      - HEALTH_SERVICE_URL=http://health:5004
      - OTEL_SERVICE_NAME=admin
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../..:/repo
      - admin-nuget:/root/.nuget
    working_dir: /repo/src/clients/Admin
    networks:
      - hellarch
    restart: unless-stopped

  health:
    build:
      context: ../../src/services/health
      dockerfile: Dockerfile
      target: dev
    container_name: hellarch-health
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - POLL_INTERVAL_MS=10000
      - EVENTS_SERVICE_URL=http://events:5005
      - OTEL_SERVICE_NAME=health
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ../../src/services/health:/app
    networks:
      - hellarch
    restart: unless-stopped

  events:
    build:
      context: ../..
      dockerfile: src/services/events/Dockerfile
      target: dev
    container_name: hellarch-events
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5005:5005"
    environment:
      - HTTP_ADDRESS=:5005
      - DATABASE_URL=postgres://hellarch:hellarch@events-db:5432/events_db
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - RABBITMQ_MANAGEMENT_URL=http://hellarch:hellarch@rabbitmq:15672
      - OTEL_SERVICE_NAME=events
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../..:/repo
      - events-go-cache:/go/pkg/mod
    working_dir: /repo/src/services/events
    networks:
      - hellarch
    restart: unless-stopped

  audit-worker:
    build:
      context: ../..
      dockerfile: src/workers/audit/Dockerfile
      target: dev
    container_name: hellarch-audit-worker
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - EVENTS_API_URL=http://events:5005
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - OTEL_SERVICE_NAME=audit-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4318
    volumes:
      - ../..:/repo
      - audit-go-cache:/go/pkg/mod
    working_dir: /repo/src/workers/audit
    networks:
      - hellarch
    restart: unless-stopped

  webhooks-worker:
    build:
      context: ../..
      dockerfile: src/workers/webhooks/Dockerfile
      target: dev
    container_name: hellarch-webhooks-worker
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - EVENTS_API_URL=http://events:5005
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - OTEL_SERVICE_NAME=webhooks-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4318
    volumes:
      - ../..:/repo
      - webhooks-go-cache:/go/pkg/mod
    working_dir: /repo/src/workers/webhooks
    networks:
      - hellarch
    restart: unless-stopped

  realtime-worker:
    build:
      context: ../..
      dockerfile: src/workers/realtime/Dockerfile
      target: dev
    container_name: hellarch-realtime-worker
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5020:5020"
    env_file:
      - ../../.env
      - ../../.env.secrets
    environment:
      - ASPNETCORE_URLS=http://+:5020
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - AUTH_SERVICE_URL=http://hellarch-auth:5001
      - JWT_PUBLIC_KEY_PATH=/keys/dev-public.pem
      - CORS_ORIGINS=http://localhost:5000,http://localhost:5010,http://hellarch-gateway:5000,http://hellarch-admin:5003
      - OTEL_SERVICE_NAME=realtime-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../..:/repo
      - ../../infra/keys:/keys:ro
      - realtime-nuget:/root/.nuget
    working_dir: /repo/src/workers/realtime
    networks:
      - hellarch
    restart: unless-stopped

  infra-worker:
    build:
      context: ../..
      dockerfile: src/workers/infra/Dockerfile
      target: dev
    container_name: hellarch-infra-worker
    # No user: directive - needs root for Docker socket access
    environment:
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - ORCHESTRATOR_BACKEND=docker
      - RESTART_COOLDOWN_SECONDS=60
      - MAX_RESTARTS=3
      - RESTART_WINDOW_SECONDS=300
      - OTEL_SERVICE_NAME=infra-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../..:/repo
      - infra-go-cache:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /repo/src/workers/infra
    networks:
      - hellarch
    restart: unless-stopped

  dlq-worker:
    build:
      context: ../..
      dockerfile: src/workers/dlq/Dockerfile
      target: dev
    container_name: hellarch-dlq-worker
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5025:5025"
    environment:
      - ASPNETCORE_URLS=http://+:5025
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - OTEL_SERVICE_NAME=dlq-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../..:/repo
      - dlq-nuget:/root/.nuget
    working_dir: /repo/src/workers/dlq
    networks:
      - hellarch
    restart: unless-stopped

  files:
    build:
      context: ../..
      dockerfile: src/services/files/Dockerfile
      target: dev
    container_name: hellarch-files
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5006:5006"
    environment:
      - HTTP_ADDRESS=:5006
      - DATABASE_URL=postgres://hellarch:hellarch@files-db:5432/files_db
      - RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=hellarch
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-hellarch}
      - MINIO_BUCKET=hellarch-files
      - MINIO_USE_SSL=false
      - MAX_UPLOAD_SIZE=1073741824
      - OTEL_SERVICE_NAME=files
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../..:/repo
      - files-go-cache:/go/pkg/mod
    working_dir: /repo/src/services/files
    networks:
      - hellarch
    restart: unless-stopped

  images-worker:
    build:
      context: ../..
      dockerfile: src/workers/images/Dockerfile
      target: dev
    container_name: hellarch-images-worker
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - IMAGES_RABBITMQ_URL=amqp://hellarch:hellarch@rabbitmq:5672
      - IMAGES_MINIO_ENDPOINT=minio:9000
      - IMAGES_MINIO_ACCESS_KEY=hellarch
      - IMAGES_MINIO_SECRET_KEY=${MINIO_PASSWORD:-hellarch}
      - IMAGES_MINIO_BUCKET=hellarch-files
      - IMAGES_MINIO_USE_SSL=false
      - IMAGES_FILES_API_URL=http://hellarch-files:5006
      - IMAGES_THUMBNAIL_SIZE=256
      - IMAGES_HEALTH_ADDRESS=:8081
      - OTEL_SERVICE_NAME=images-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=debug
    volumes:
      - ../..:/repo
      - images-go-cache:/go/pkg/mod
    working_dir: /repo/src/workers/images
    networks:
      - hellarch
    restart: unless-stopped

volumes:
  gateway-nuget:
  auth-go-cache:
  user-nuget:
  identity-nuget:
  admin-nuget:
  events-go-cache:
  audit-go-cache:
  webhooks-go-cache:
  realtime-nuget:
  infra-go-cache:
  dlq-nuget:
  files-go-cache:
  images-go-cache:

networks:
  hellarch:
    external: true
