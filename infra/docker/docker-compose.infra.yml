services:
  auth-db:
    image: hellarch-auth-db
    build:
      context: ../..
      dockerfile: infra/dbs/auth-db/Dockerfile
    container_name: hellarch-auth-db
    environment:
      POSTGRES_USER: hellarch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hellarch}
      POSTGRES_DB: auth_db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
      HELLARCH_ENV: development
    ports:
      - "5434:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellarch -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hellarch

  user-db:
    image: hellarch-user-db
    build:
      context: ../..
      dockerfile: infra/dbs/user-db/Dockerfile
    container_name: hellarch-user-db
    environment:
      POSTGRES_USER: hellarch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hellarch}
      POSTGRES_DB: user_db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
      HELLARCH_ENV: development
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellarch -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hellarch

  redis:
    image: redis:7-alpine
    container_name: hellarch-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hellarch

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hellarch-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hellarch
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hellarch}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - hellarch

volumes:
  auth-db-data:
  user-db-data:
  redis-data:
  rabbitmq-data:

networks:
  hellarch:
    name: hellarch
